name: sobilog
description: "Sobilog personal account book app."
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.2.0
  image_picker: ^1.2.3
  logger: ^2.7.0
  path_provider: ^2.1.6
  http: ^1.6.0
  flutter_secure_storage: ^11.1.1
  url_launcher: ^6.3.2
  kakao_flutter_sdk_share: ^2.0.1
  kakao_flutter_sdk_user: ^2.0.1
  sign_in_with_apple: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/icons/navigation/
    - assets/images/home/
    - assets/images/auth/
    - assets/bank_logos/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
    - family: BujangnimNunchi
      fonts:
        - asset: assets/fonts/BujangnimNunchi-Regular.ttf
    - family: Amarante
      fonts:
        - asset: assets/fonts/Amarante-Regular.ttf
