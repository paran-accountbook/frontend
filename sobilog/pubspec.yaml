name: sobilog
description: "Sobilog personal account book app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.2.0
  logger: ^2.7.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/icons/
    - assets/icons/navigation/
    - assets/images/home/
    - assets/images/auth/
  fonts:
    - family: BujangnimNunchi
      fonts:
        - asset: assets/fonts/BujangnimNunchi-Regular.ttf
    - family: Amarante
      fonts:
        - asset: assets/fonts/Amarante-Regular.ttf
